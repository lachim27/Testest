
name: ZlapEgzamin Android APK

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'



      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'


      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true


      - name: Setup compatible Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate portal script
        run: |
          node --check app/src/main/assets/slot-hook.js
          node --test tests/booking-safety.test.js

      - name: Build APK
        run: gradle testDebugUnitTest assembleDebug --no-daemon

      - name: Verify APK exists
        run: |
          ls -lah app/build/outputs/apk/debug/
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ZlapEgzamin-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # Only publish when the commit explicitly includes [apk].
      # The resulting release asset is a direct APK, not an Actions ZIP.
      - name: Publish direct APK download
        if: contains(github.event.head_commit.message, '[apk]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZlapEgzamin-Android.apk
          gh release create "android-beta-${GITHUB_RUN_NUMBER}" ZlapEgzamin-Android.apk \
            --target "${GITHUB_SHA}" \
            --title "ZlapEgzamin Android (#${GITHUB_RUN_NUMBER})" \
            --notes "Wersja testowa z alarmem nowego pasującego terminu i potwierdzonej rezerwacji. W ustawieniach dostępny test alarmu. Autorezerwacja wymaga włączenia; płatność w portalu." \
            --prerelease
