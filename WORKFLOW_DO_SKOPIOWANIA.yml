name: ZlapEgzamin Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Zbuduj APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Zainstaluj Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      # Projekt nie zawiera gradle-wrapper.jar, dlatego instalujemy Gradle przez Action.
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Kompiluj aplikacje
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Udostepnij APK
        uses: actions/upload-artifact@v4
        with:
          name: ZlapEgzamin-Android-TEST-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
